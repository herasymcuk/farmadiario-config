name: Aggiornamento Giornaliero Banca Dati FarmaDiario

on:
  schedule:
    - cron: '0 5 * * *'   # Ogni mattina alle 06:00 ora italiana
  workflow_dispatch:       # Ti permette di lanciarlo anche manualmente con 1 click

jobs:
  sync-aifa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Esegui sincronizzazione AIFA e prezzi
        run: python scripts/daily_aifa_sync.py
      - name: Pubblica JSON aggiornati
        run: |
          git config user.name "FarmaDiario Sync Bot"
          git config user.email "bot@farmadiario.local"
          git add remote_config.json delta_updates.json
          git diff --staged --quiet || git commit -m "Sync automatico AIFA, prezzi e ritiri"
          git push
